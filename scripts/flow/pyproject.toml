[project]
name = "agentops-flow"
version = "0.1.0"
description = "Workflow CLI over gh for the AgentOps issue loop"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
flow = "flow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow"]

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["flow", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
